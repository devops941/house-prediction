<!doctype html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}House Price Prediction{% endblock %} | KZ-ML-01</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <script>
    /* Apply Bootstrap's dark theme before first paint — eliminates FOUT */
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
      });
    })();
  </script>
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-kz">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <span class="brand-badge"><i class="bi bi-houses-fill"></i></span>
        <span>House<span class="text-muted fw-normal">Price</span>AI</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
              <i class="bi bi-house-door me-1"></i>Predict
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'history' %}active{% endif %}" href="{{ url_for('history') }}">
              <i class="bi bi-clock-history me-1"></i>History
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'insights' %}active{% endif %}" href="{{ url_for('insights') }}">
              <i class="bi bi-graph-up-arrow me-1"></i>Model Insights
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer-kz">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <span>KZ-ML-01 &middot; House Price Prediction using Linear Regression</span>
      <span>Built with Flask, scikit-learn &amp; Bootstrap 5</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

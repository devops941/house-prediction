[project]
name = "nestquest"
version = "1.0.0"
description = "NestQuest — brokerage-free property marketplace with an AI price estimator"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pymongo>=4.9",
    "motor>=3.6",
    "certifi>=2024.8",
    "bcrypt>=4.2",
    "PyJWT>=2.9",
    "email-validator>=2.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "cloudinary>=1.40",
]

# matplotlib / seaborn are intentionally excluded here: they are only used by the
# training scripts and notebook, not by the running app. Keeping them out of the
# runtime dependency set keeps the Vercel serverless function under the size limit.

[tool.vercel]
entrypoint = "backend.main:app"
